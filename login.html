<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | Voces con Derechos</title>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <main class="login-page">

        <!-- =========================================
             FONDO DECORATIVO
        ========================================== -->

        <div class="background-decoration">

            <div class="background-circle circle-one"></div>
            <div class="background-circle circle-two"></div>
            <div class="background-circle circle-three"></div>

            <div class="background-orb orb-one"></div>
            <div class="background-orb orb-two"></div>
            <div class="background-orb orb-three"></div>

            <div class="background-shape shape-one"></div>
            <div class="background-shape shape-two"></div>

        </div>


        <!-- =========================================
             CONTENIDO
        ========================================== -->

        <div class="login-container">

            <div class="login-card">

                <!-- Logo -->

                <div class="brand">

                    <img
                        src="assets/logo.png"
                        alt="Voces con Derechos"
                        class="login-logo"
                    >

                </div>


                <!-- Volver -->

                <a href="index.html" class="back-link">
                    <span>←</span>
                    Volver al inicio
                </a>


                <!-- Header -->

                <div class="login-header">

                    <div class="login-icon">
                        🔐
                    </div>

                    <span class="section-label">
                        ACCESO A LA PLATAFORMA
                    </span>

                    <h2>
                        Iniciar sesión
                    </h2>

                    <p>
                        Ingresa tus credenciales para continuar
                        aprendiendo y explorando la plataforma.
                    </p>

                </div>


                <!-- =========================================
                     FORMULARIO
                ========================================== -->

                <form id="loginForm">

                    <!-- Correo -->

                    <div class="form-group">

                        <label for="email">
                            Correo electrónico
                        </label>

                        <div class="input-wrapper">

                            <span class="input-icon">
                                ✉
                            </span>

                            <input
                                type="email"
                                id="email"
                                placeholder="ejemplo@correo.com"
                                autocomplete="email"
                                required
                            >

                        </div>

                    </div>


                    <!-- Contraseña -->

                    <div class="form-group">

                        <label for="password">
                            Contraseña
                        </label>

                        <div class="password-container">

                            <span class="input-icon">
                                🔒
                            </span>

                            <input
                                type="password"
                                id="password"
                                placeholder="Ingresa tu contraseña"
                                autocomplete="current-password"
                                required
                            >

                            <button
                                type="button"
                                id="togglePassword"
                                class="toggle-password"
                            >
                                Mostrar
                            </button>

                        </div>

                    </div>


                    <!-- Botón -->

                    <button
                        type="submit"
                        class="login-button"
                        id="loginButton"
                    >

                        <span>
                            Iniciar sesión
                        </span>

                        <strong>
                            →
                        </strong>

                    </button>

                </form>


                <!-- Mensaje -->

                <div
                    id="loginMessage"
                    class="login-message"
                ></div>


                <!-- Información de seguridad -->

                <div class="login-info">

                    <span>
                        🔒
                    </span>

                    <p>
                        Tu información se mantiene protegida.
                        Utiliza tus credenciales personales para
                        acceder a tu cuenta.
                    </p>

                </div>

            </div>

        </div>

    </main>


    <script src="js/login.js"></script>

</body>

</html>

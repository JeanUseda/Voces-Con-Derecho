<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Voces con Derechos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <main class="login-page">

        <!-- Decoración izquierda -->
        <div class="login-decoration">
            <div class="decoration-content">
                <img src="assets/logo.png" alt="Voces con Derechos" class="login-logo">
                <h1>Bienvenido<br>de vuelta.<br><span>¡Sigue aprendiendo!</span></h1>
                <p>Inicia sesión para continuar aprendiendo sobre derechos e igualdad.</p>
                <img src="assets/hero.png" alt="" class="decoration-image">
            </div>
        </div>

        <!-- Formulario -->
        <div class="login-container">
            <div class="login-card glass-card">
                <a href="index.html" class="back-link">← Volver al inicio</a>

                <div class="login-header">
                    <h2>Iniciar sesión</h2>
                    <p>Ingresa tus credenciales para continuar.</p>
                </div>

                <!-- SELECTOR DE ROL -->
                <div class="form-group" style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 8px; font-size: 13px; font-weight: 600;">¿Qué tipo de usuario eres?</label>
                    <div class="rol-selector-group">
                        <button type="button" id="rolEstudiante" class="rol-selector active">
                            🎓 Estudiante
                        </button>
                        <button type="button" id="rolProfesor" class="rol-selector">
                            👨‍🏫 Profesor
                        </button>
                    </div>
                </div>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="email">Correo electrónico / Usuario</label>
                        <div class="input-container">
                            <input type="text" id="email" placeholder="ejemplo@correo.com" required>
                            <span class="input-icon">📧</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <div class="input-container password-container">
                            <input type="password" id="password" placeholder="Ingresa tu contraseña" required>
                            <button type="button" id="togglePassword" class="toggle-password">Mostrar</button>
                        </div>
                    </div>

                    <button type="submit" class="login-button pulse-on-hover" id="loginButton">
                        Iniciar sesión <span>→</span>
                    </button>
                </form>

                <div id="loginMessage" class="login-message"></div>

                <div class="login-footer">
                    <p id="footerText">¿Aún no tienes cuenta?</p>
                    <a href="registro.html" id="footerLink">Regístrate aquí</a>
                </div>
            </div>
        </div>

    </main>

    <script src="js/login.js"></script>

</body>
</html>

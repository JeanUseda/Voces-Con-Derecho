<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | Voces con Derechos</title>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <main class="login-page">

        <!-- Decoración izquierda -->
        <div class="login-decoration">

            <div class="decoration-content">

                <img
                    src="assets/logo.png"
                    alt="Voces con Derechos"
                    class="login-logo"
                >

                <h1>
                    Bienvenido
                    <br>
                    de vuelta.
                    <br>
                    <span>¡Sigue aprendiendo!</span>
                </h1>

                <p>
                    Inicia sesión para continuar aprendiendo
                    sobre derechos e igualdad.
                </p>

                <img
                    src="assets/hero.png"
                    alt=""
                    class="decoration-image"
                >

            </div>

        </div>

        <!-- Formulario -->
        <div class="login-container">

            <div class="login-card">

                <a href="index.html" class="back-link">
                    ← Volver al inicio
                </a>

                <div class="login-header">

                    <h2>Iniciar sesión</h2>

                    <p>
                        Ingresa tus credenciales para continuar.
                    </p>

                </div>

                <!-- SELECTOR DE ROL -->
                <div class="form-group" style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 8px; font-size: 13px; font-weight: 600;">
                        ¿Qué tipo de usuario eres?
                    </label>
                    <div style="display: flex; gap: 12px;">
                        <button
                            type="button"
                            id="rolEstudiante"
                            class="rol-selector active"
                            style="
                                flex: 1;
                                padding: 12px;
                                border: 2px solid var(--primary);
                                border-radius: 10px;
                                background: var(--purple-soft);
                                color: var(--primary);
                                font-weight: 600;
                                cursor: pointer;
                                transition: 0.2s;
                            "
                        >
                            🎓 Estudiante
                        </button>
                        <button
                            type="button"
                            id="rolProfesor"
                            class="rol-selector"
                            style="
                                flex: 1;
                                padding: 12px;
                                border: 2px solid var(--border);
                                border-radius: 10px;
                                background: white;
                                color: var(--text-light);
                                font-weight: 600;
                                cursor: pointer;
                                transition: 0.2s;
                            "
                        >
                            👨‍🏫 Profesor
                        </button>
                    </div>
                </div>

                <form id="loginForm">

                    <div class="form-group">

                        <label for="email">
                            Correo electrónico / Usuario
                        </label>

                        <input
                            type="text"
                            id="email"
                            placeholder="ejemplo@correo.com"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label for="password">
                            Contraseña
                        </label>

                        <div class="password-container">

                            <input
                                type="password"
                                id="password"
                                placeholder="Ingresa tu contraseña"
                                required
                            >

                            <button
                                type="button"
                                id="togglePassword"
                                class="toggle-password"
                            >
                                Mostrar
                            </button>

                        </div>

                    </div>

                    <button
                        type="submit"
                        class="login-button"
                        id="loginButton"
                    >
                        Iniciar sesión
                        <span>→</span>
                    </button>

                </form>

                <div
                    id="loginMessage"
                    class="login-message"
                ></div>

                <div class="login-footer">

                    <p id="footerText">
                        ¿Aún no tienes cuenta?
                    </p>

                    <a href="registro.html" id="footerLink">
                        Regístrate aquí
                    </a>

                </div>

            </div>

        </div>

    </main>

    <script src="js/login.js"></script>

</body>
</html>

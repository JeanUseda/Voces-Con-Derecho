<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misión | Voces con Derechos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/mision-detalle.css">
</head>
<body>

    <div class="mision-container">

        <!-- Header -->
        <header class="mision-header">
            <a href="dashboardEstudiantes.html" class="btn-volver">
                ← Volver al dashboard
            </a>
            <div class="mision-info">
                <span id="misionTitulo">Cargando misión...</span>
                <span id="progresoMision" class="stats-mini pulse-glow">0/0 completadas</span>
            </div>
        </header>

        <!-- Barra de progreso con shimmer -->
        <div class="progreso-barra">
            <div class="progreso-fill" id="progresoFill" style="width: 0%;">
                <div class="shimmer-effect"></div>
            </div>
        </div>

        <!-- Lista de historias como línea de tiempo -->
        <div class="timeline-container">
            <div id="historiasContainer" class="timeline">
                <div class="loading shimmer">Cargando historias...</div>
            </div>
        </div>

    </div>

    <script src="js/mision-detalle.js"></script>

</body>
</html>
